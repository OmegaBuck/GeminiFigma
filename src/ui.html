<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent-color: #7c4dff;
      --accent-glow: rgba(124, 77, 255, 0.4);
      --text-main: #f0f0f5;
      --text-dim: #a0a0b0;
      --border-color: rgba(255, 255, 255, 0.1);
      --nav-bg: rgba(255, 255, 255, 0.03);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Navigation Header */
    header {
      display: flex;
      padding: 12px 16px;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .tab-btn.active {
      color: var(--text-main);
      background: var(--card-bg);
    }

    /* Main Container */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .view.active {
      display: flex;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0 0 16px 0;
      background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-family: inherit;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    button.primary {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      margin-top: 8px;
    }

    button.primary:active {
      transform: scale(0.98);
    }

    button.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Analyze View Specifics */
    .preview-section {
      margin-bottom: 20px;
    }

    #preview-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .preview-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #000;
    }

    .frame-badge {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-top: 4px;
    }


    .status {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-align: center;
      margin: 12px 0;
    }

    .loading-pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-color);
      margin-left: 4px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.2);
        opacity: 1;
      }

      100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
    }

    .response-area {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: none;
      margin-top: 8px;
    }

    .response-area h1 {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: none;
      -webkit-text-fill-color: var(--accent-color);
    }

    .response-area h2 {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-top: 16px;
      margin-bottom: 8px;
    }


    /* Settings View Specifics */
    .settings-info {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.4;
      margin-top: 8px;
    }

    .settings-info a {
      color: var(--accent-color);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <button id="tab-analyze" class="tab-btn active">Analyze</button>
    <button id="tab-settings" class="tab-btn">Settings</button>
  </header>

  <main>
    <!-- View: Analyze -->
    <div id="view-analyze" class="view active">
      <div class="preview-section">
        <button id="btn-select" class="primary">Select Design Frame(s)</button>
        <div id="status-text" class="status">Pick frames to start.</div>
        <div id="preview-container"></div>
      </div>


      <div id="prompt-area" style="display: none;">
        <div class="input-group">
          <label for="user-prompt">UI/UX Goal (Optional)</label>
          <textarea id="user-prompt" rows="3"
            placeholder="e.g., 'Suggest layout improvements' or 'Review against Fitts's Law'"></textarea>
        </div>
        <button id="btn-analyze" class="primary">Analyze Design</button>
      </div>

      <div id="response-area" class="response-area"></div>
    </div>

    <!-- View: Settings -->
    <div id="view-settings" class="view">
      <h1>Settings</h1>
      <div class="glass-card">
        <div class="input-group">
          <label for="api-key">Gemini API Key</label>
          <input type="password" id="api-key" placeholder="Paste your API key here...">
          <div class="settings-info">
            Your key is stored locally in Figma. <br>
            Don't have a key? <a href="https://aistudio.google.com/app/apikey" target="_blank">Get one for free
              here.</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
